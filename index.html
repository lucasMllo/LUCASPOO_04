    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sistema de Estoque - POO</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div class="container">
            <h1>Cadastro de Produto</h1>

            <!-- Formulário de Entrada -->
            <form id="produto-form">

                <div class="form-group">
                    <label for="nome">Nome do Produto:</label>
                    <input type="text" id="nome" placeholder="Ex: Notebook" required />
                </div>

                <div class="form-group">
                    <label for="preco">Preço (R$):</label>
                    <input type="number" id="preco" step="0.01" placeholder="Ex: 3500.00" required />
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" placeholder="Ex: 5" required />
                </div>

                <button type="submit" class="btn-primary">Adicionar Produto</button>
            </form>

            <!-- Cabeçalho de Ações e Resumo -->
            <div class="resumo-container">
                <h3 id="total-estoque">Total em Estoque: R$ 0,00</h3>
                <button id="limpar-tabela" class="btn-danger">Limpar Tudo</button>
            </div>

            <!-- Tabela de Exibição dos Produtos -->
            <table id="tabela-produtos">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Subtotal</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- As linhas dos produtos serão inseridas aqui via JavaScript -->
                </tbody>
            </table>
        </div>

        <script>
            // ===================================================
            // FASE 1: MODELAGEM DOS DADOS (Classe Base)
            // ===================================================
            // A classe funciona como um "molde" ou "planta baixa" para criar produtos.
            class Produto {
                #preco;
                #quantidade;

                constructor(nome, preco, quantidade) {
                    const precoNum = parseFloat(preco);
                    const quantidadeNum = parseInt(quantidade);

                    if (!nome || nome.trim() === "") {
                        throw new Error("O nome do produto não pode estar em branco.");
                    }
                    if (isNaN(precoNum) || precoNum <= 0) {
                        throw new Error("O preço deve ser um valor maior que R$ 0,00.");
                    }
                    if (isNaN(quantidadeNum) || quantidadeNum <= 0) {
                        throw new Error("A quantidade deve ser um número inteiro maior que 0.");
                    }

                    // Propriedades do objeto recebidas no momento da criação
                    this.nome = nome.trim();
                    this.#preco = precoNum;
                    this.#quantidade = quantidadeNum;
                }

                get preco() {
                    return this.#preco;
                }

                get quantidade() {
                    return this.#quantidade;
                }

                // Método que calcula o subtotal deste produto específico
                calcularSubtotal() {
                    return this.#preco * this.#quantidade;
                }
            }

            // ===================================================
            // FASE 2: GERENCIAMENTO DE ESTADO (Memória)
            // ===================================================
            // Array global que guardará todas as instâncias da classe Produto
            const listaDeProdutos = [];

            // ===================================================
            // FASE 3: ESCUTA DE EVENTOS DO DOM
            // ===================================================
            // Selecionamos o formulário do HTML pelo ID
            const formProduto = document.getElementById("produto-form");
            const btnLimparTabela = document.getElementById("limpar-tabela");

            // Adicionamos um escutador de eventos para quando o formulário for enviado (submit)
            formProduto.addEventListener("submit", function (event) {
                // Impede que a página recarregue ao enviar o formulário
                event.preventDefault();

                try {
                    // 1. Captura os valores digitados nos campos de input do HTML
                    const nomeInput = document.getElementById("nome").value;
                    const precoInput = document.getElementById("preco").value;
                    const quantidadeInput = document.getElementById("quantidade").value;

                    // 2. Cria uma nova instância da classe Produto (Instanciação)
                    const novoProduto = new Produto(nomeInput, precoInput, quantidadeInput);

                    // 3. Adiciona o novo produto ao nosso Array de memória
                    listaDeProdutos.push(novoProduto);

                    // 4. Atualiza a exibição da tabela e limpa o formulário
                    renderizarTabela();
                    formProduto.reset();
                } catch (erro) {
                    alert(erro.message);
                }
            });

            // Evento de clique para limpar todos os produtos da memória
            btnLimparTabela.addEventListener("click", function () {
                listaDeProdutos.length = 0;
                renderizarTabela();
            });

            // Função responsável por remover um item específico pelo seu índice
            function removerProduto(index) {
                listaDeProdutos.splice(index, 1);
                renderizarTabela();
            }

            // ===================================================
            // FASE 4: RENDERIZAÇÃO DA INTERFACE (DOM)
            // ===================================================
            function atualizarTotalEstoque() {
                const total = listaDeProdutos.reduce((acumulador, produto) => {
                    return acumulador + produto.calcularSubtotal();
                }, 0);

                const totalFormatado = new Intl.NumberFormat('pt-BR', {
                    style: 'currency',
                    currency: 'BRL'
                }).format(total);

                document.getElementById("total-estoque").innerText = `Total em Estoque: ${totalFormatado}`;
            }

            // Função responsável por desenhar na tela o estado atual do Array listaDeProdutos
            function renderizarTabela() {
                // Seleciona o corpo da tabela (tbody)
                const tabelaBody = document.querySelector("#tabela-produtos tbody");

                // Limpa o conteúdo anterior da tabela para evitar duplicações
                tabelaBody.innerHTML = "";

                // Percorre o Array de produtos usando forEach com o índice
                listaDeProdutos.forEach((produto, index) => {
                    // Cria um elemento <tr> (linha da tabela)
                    const linha = document.createElement("tr");

                    // Preenche o conteúdo interno da linha com os dados do objeto e o botão contendo o evento onClick
                    linha.innerHTML = `
                        <td>${produto.nome}</td>
                        <td>R$ ${produto.preco.toFixed(2)}</td>
                        <td>${produto.quantidade}</td>
                        <td>R$ ${produto.calcularSubtotal().toFixed(2)}</td>
                        <td>
                            <button class="btn-remover" onclick="removerProduto(${index})">Remover</button>
                        </td>
                    `;

                    // Insere a linha criada dentro do tbody da tabela
                    tabelaBody.appendChild(linha);
                });

                atualizarTotalEstoque();
            }
        </script>
    </body>
    </html>
